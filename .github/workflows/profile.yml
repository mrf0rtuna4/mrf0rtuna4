name: Update Profile Assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p generated

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: tokyonight
          AUTO_PUSH: false

      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: profile/

  streak:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p profile

      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: streak
          path: profile/streak.svg

  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p profile

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: stats
          path: profile/stats.svg

  translate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mrf0rtuna4/Git-Markdown-AutoTranslator@master
        with:
          LANGS: "ru,ar,uk,it,ja"
          FILES: "README.md"
          DEBUG: "True"

      - uses: actions/upload-artifact@v4
        with:
          name: translations
          path: |
            README*.md

  commit:
    runs-on: ubuntu-latest

    needs:
      - summary
      - streak
      - stats
      - translate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: |
          mkdir -p profile

          cp -r artifacts/summary/* .
          cp artifacts/streak/streak.svg profile/
          cp artifacts/stats/stats.svg profile/
          cp artifacts/translations/* .

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add .

          git diff --cached --quiet && exit 0

          git commit -m "Update profile assets"
          git push
